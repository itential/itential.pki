---
- name: Copy private key
  ansible.builtin.copy:
    src: "{{ tls_local_certs_dir }}/{{ tls_local_key_filename }}"
    dest: "{{ tls_remote_keys_dir }}/{{ tls_remote_key_filename }}"
    owner: root
    group: root
    mode: '0600'

- name: Copy certificate
  ansible.builtin.copy:
    src: "{{ tls_local_certs_dir }}/{{ tls_local_cert_filename }}"
    dest: "{{ tls_remote_certs_dir }}/{{ tls_remote_cert_filename }}"
    owner: root
    group: root
    mode: '0444'
