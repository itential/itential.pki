---
# --------------
# Build SAN list
# --------------
- name: Start SAN list with DNS:inventory_hostname
  ansible.builtin.set_fact:
    tls_san_list: "{{ groups['all'] | map('regex_replace', '^(.*)$', 'DNS:\\1') | list }}"

- name: Add DNS:ansible_fqdn when present
  ansible.builtin.set_fact:
    tls_san_list: "{{ (tls_san_list + ['DNS:' + hostvars[item].ansible_fqdn]) | unique }}"
  loop: "{{ groups['all'] }}"
  when: hostvars[item].ansible_fqdn is defined

- name: Add IP/DNS from ansible_host if defined (regex detect IP)
  ansible.builtin.set_fact:
    tls_san_list: >-
      {{
        (tls_san_list + [
          ('IP:'  + hostvars[item].ansible_host)
          if (hostvars[item].ansible_host is match('^[0-9]{1,3}(?:\.[0-9]{1,3}){3}$'))
          else ('DNS:' + hostvars[item].ansible_host)
        ]) | unique
      }}
  loop: "{{ groups['all'] }}"
  when: hostvars[item].ansible_host is defined

- name: Add fallback IP from ansible_default_ipv4.address when ansible_host absent
  ansible.builtin.set_fact:
    tls_san_list: "{{ (tls_san_list + ['IP:' + hostvars[item].ansible_default_ipv4.address]) | unique }}"
  loop: "{{ groups['all'] }}"
  when:
    - hostvars[item].ansible_default_ipv4 is defined
    - hostvars[item].ansible_default_ipv4.address is defined

- name: Sort SAN list for stable idempotent output
  ansible.builtin.set_fact:
    tls_san_list: "{{ tls_san_list | sort }}"

- name: Ensure SAN list is not empty
  ansible.builtin.assert:
    that: tls_san_list | length > 0
    fail_msg: "SAN list is empty; inventory produced no names/addresses."

- name: Show SAN list
  ansible.builtin.debug:
    var: tls_san_list

# -----------------------------------
# Multi-Domain leaf cert signed by CA
# -----------------------------------
- name: Generate private key for multi-domain cert
  community.crypto.openssl_privatekey:
    path: "{{ tls_pki_md_key_file_local }}"
    size: 2048
    type: RSA
    mode: '0600'

- name: Generate CSR with SANs (leaf)
  community.crypto.openssl_csr:
    path: "{{ tls_pki_md_csr_file_local }}"
    privatekey_path: "{{ tls_pki_md_key_file_local }}"
    common_name: "{{ tls_csr_common_name }}"
    subject_alt_name: "{{ tls_san_list }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth

- name: Sign CSR with CA (leaf cert, selfsigned)
  community.crypto.x509_certificate:
    path: "{{ tls_pki_md_cert_file_local }}"
    csr_path: "{{ tls_pki_md_csr_file_local }}"
    privatekey_path: "{{ tls_pki_md_key_file_local }}"
    provider: selfsigned
  when: not tls_own_ca | bool

- name: Sign CSR with CA (leaf cert, ownca)
  community.crypto.x509_certificate:
    path: "{{ tls_pki_md_cert_file_local }}"
    csr_path: "{{ tls_pki_md_csr_file_local }}"
    provider: ownca
    ownca_path: "{{ tls_pki_ca_cert_file_local }}"
    ownca_privatekey_path: "{{ tls_pki_ca_key_file_local }}"
    ownca_not_after: "+365d"
  when: tls_own_ca | bool
