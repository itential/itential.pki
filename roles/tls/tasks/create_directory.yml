- name: Ensure directory exists
  ansible.builtin.file:
    path: "{{ dir_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Gather SELinux facts
  ansible.builtin.setup:
    filter: ansible_selinux
  when: ansible_selinux is not defined

- name: Set SELinux context on directory
  community.general.sefcontext:
    target: "{{ dir_path }}(/.*)?"
    setype: cert_t
    state: present
  when: ansible_selinux.status == "enabled"

- name: Apply SELinux context to directory
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ dir_path }}"
  when: ansible_selinux.status == "enabled"
