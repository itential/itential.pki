---
# -----------------
# CA (CSR with CA extensions -> self-signed CA cert)
# -----------------
- name: Generate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ tls_pki_ca_key_file_src }}"
    size: 4096
    type: RSA
    mode: '0600'

- name: Generate CA CSR with CA extensions
  community.crypto.openssl_csr:
    path: "{{ tls_pki_ca_csr_file_src }}"
    privatekey_path: "{{ tls_pki_ca_key_file_src }}"
    common_name: "{{ tls_ca_common_name }}"
    basic_constraints:
      - "CA:TRUE"
    key_usage:
      - keyCertSign
      - cRLSign

- name: Self-sign the CA CSR
  community.crypto.x509_certificate:
    path: "{{ tls_pki_ca_cert_file_src }}"
    csr_path: "{{ tls_pki_ca_csr_file_src }}"
    privatekey_path: "{{ tls_pki_ca_key_file_src }}"
    provider: selfsigned
    # selfsigned_not_after: "+10y"
