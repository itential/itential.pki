---
- name: Generate private key
  community.crypto.openssl_privatekey:
    path: "{{ tls_pki_key_file_src }}"
    size: 2048
    type: RSA
    mode: '0600'
  delegate_to: localhost

- name: Generate CSR with SANs
  community.crypto.openssl_csr:
    path: "{{ tls_pki_csr_file_src }}"
    privatekey_path: "{{ tls_pki_key_file_src }}"
    common_name: "{{ tls_csr_common_name }}"
    country_name: "{{ tls_csr_country_name }}"
    organization_name: "{{ tls_csr_organization_name }}"
    organizational_unit_name: "{{ tls_csr_organizational_unit_name }}"
    state_or_province_name: "{{ tls_csr_state_or_province_name }}"
    locality_name: "{{ tls_csr_locality_name }}"
    subject_alt_name:
      - "DNS:{{ inventory_hostname }}"
      - "DNS:{{ ansible_fqdn | default(inventory_hostname) }}"
      - "IP:{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
  delegate_to: localhost

- name: Generate certificate with SANs (selfsigned)
  community.crypto.x509_certificate:
    path: "{{ tls_pki_cert_file_src }}"
    csr_path: "{{ tls_pki_csr_file_src }}"
    privatekey_path: "{{ tls_pki_key_file_src }}"
    provider: selfsigned
  when: not tls_own_ca | bool
  delegate_to: localhost

- name: Generate certificate with SANs (ownca)
  community.crypto.x509_certificate:
    path: "{{ tls_pki_cert_file_src }}"
    csr_path: "{{ tls_pki_csr_file_src }}"
    provider: ownca
    ownca_path: "{{ tls_pki_ca_cert_file_src }}"
    ownca_privatekey_path: "{{ tls_pki_ca_key_file_src }}"
  when: tls_own_ca | bool
  delegate_to: localhost
