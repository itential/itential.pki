---
# The local certificate directory must be defined in the inventory
tls_local_certs_dir:

# The remote CA, certificate and key directories
tls_remote_ca_certs_dir: /etc/pki/ca-trust/source/anchors
tls_remote_certs_dir: /etc/pki/tls/certs
tls_remote_keys_dir: /etc/pki/tls/private

# SSL common defaults
tls_own_ca: true

# The CSR defaults
tls_csr_common_name: Itential
tls_csr_country_name: US
tls_csr_organization_name: Itential
tls_csr_organizational_unit_name: IT
tls_csr_state_or_province_name: Georgia
tls_csr_locality_name: Atlanta

# The CA defaults
tls_ca_common_name: Itential CA
tls_ca_organziation_name: Itential

# The key, certificate and CSR suffix defaults
tls_key_suffix: .key
tls_cert_suffix: .crt
tls_csr_suffix: .csr

# The CA file defaults
tls_ca_filename: ca
tls_local_ca_key_filename: "{{ tls_ca_filename }}{{ tls_key_suffix }}"
tls_local_ca_cert_filename: "{{ tls_ca_filename }}{{ tls_cert_suffix }}"
tls_local_ca_csr_filename: "{{ tls_ca_filename }}{{ tls_csr_suffix }}"
tls_remote_ca_key_filename: "{{ tls_local_ca_key_filename }}"
tls_remote_ca_cert_filename: "{{ tls_local_ca_cert_filename }}"

# The multi-domain certficate and key file defaults
tls_md_cert_filename: itential
tls_md_local_key_filename: "{{ tls_md_cert_filename }}{{ tls_key_suffix }}"
tls_md_local_csr_filename: "{{ tls_md_cert_filename }}{{ tls_csr_suffix }}"
tls_md_local_cert_filename: "{{ tls_md_cert_filename }}{{ tls_cert_suffix }}"
tls_md_remote_key_filename: "{{ tls_md_local_key_filename }}"
tls_md_remote_cert_filename: "{{ tls_md_local_cert_filename }}"

# The certificate and key file defaults
tls_cert_filename: "{{ inventory_hostname }}"
tls_local_key_filename: "{{ tls_cert_filename }}{{ tls_key_suffix }}"
tls_local_csr_filename: "{{ tls_cert_filename }}{{ tls_csr_suffix }}"
tls_local_cert_filename: "{{ tls_cert_filename }}{{ tls_cert_suffix }}"
tls_remote_key_filename: "{{ tls_local_key_filename }}"
tls_remote_cert_filename: "{{ tls_local_cert_filename }}"
