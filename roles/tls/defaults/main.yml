---
# The local pki directory must be defined in the inventory
tls_pki_local_dir:

# The destination CA, certificate and key directories
tls_pki_ca_certs_dir: /etc/pki/ca-trust/source/anchors
tls_pki_certs_dir: /etc/pki/tls/certs
tls_pki_keys_dir: /etc/pki/tls/private

# Whether to use the CA for signing the certificate
tls_own_ca: true

# CSR defaults
tls_csr_common_name: Itential
tls_csr_country_name: US
tls_csr_organization_name: Itential
tls_csr_organizational_unit_name: IT
tls_csr_state_or_province_name: Georgia
tls_csr_locality_name: Atlanta

# Extended Key Usage applied to generated leaf certs (per-host + multi-domain).
# Default matches the multi-domain workflow's previous hardcoded value, so
# existing users of that workflow see no behavior change unless overridden.
tls_extended_key_usage:
  - serverAuth
  - clientAuth

# CA defaults
tls_ca_common_name: Itential CA

# Key, certificate and CSR suffix
tls_pki_key_suffix: .key
tls_pki_cert_suffix: .crt
tls_pki_pem_suffix: .pem
tls_pki_csr_suffix: .csr

# Additional SAN defaults
tls_additional_dns_sans: []
tls_additional_ip_sans: []

#############
# CA defaults
#############
tls_pki_ca_filename: ca

# CA key
tls_pki_ca_key_file: "{{ tls_pki_ca_filename }}{{ tls_pki_key_suffix }}"
tls_pki_ca_key_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_ca_key_file }}"

# CA CSR
tls_pki_ca_csr_file: "{{ tls_pki_ca_filename }}{{ tls_pki_csr_suffix }}"
tls_pki_ca_csr_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_ca_csr_file }}"

# CA certificate
tls_pki_ca_cert_file: "{{ tls_pki_ca_filename }}{{ tls_pki_cert_suffix }}"
tls_pki_ca_cert_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_ca_cert_file }}"
tls_pki_ca_cert_file_dest: "{{ tls_pki_ca_certs_dir }}/{{ tls_pki_ca_cert_file }}"

###################################
# Server certificate defaults
###################################
tls_pki_cert_filename: "{{ inventory_hostname }}"

# Server key
tls_pki_key_file: "{{ tls_pki_cert_filename }}{{ tls_pki_key_suffix }}"
tls_pki_key_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_key_file }}"
tls_pki_key_file_dest: "{{ tls_pki_keys_dir }}/{{ tls_pki_key_file }}"

# Server CSR
tls_pki_csr_file: "{{ tls_pki_cert_filename }}{{ tls_pki_csr_suffix }}"
tls_pki_csr_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_csr_file }}"

# Server certificate
tls_pki_cert_file: "{{ tls_pki_cert_filename }}{{ tls_pki_cert_suffix }}"
tls_pki_cert_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_cert_file }}"
tls_pki_cert_file_dest: "{{ tls_pki_certs_dir }}/{{ tls_pki_cert_file }}"

# PEM file (key + cert)
tls_pki_pem_file: "{{ tls_pki_cert_filename }}{{ tls_pki_pem_suffix }}"
tls_pki_pem_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_pem_file }}"
tls_pki_pem_file_dest: "{{ tls_pki_certs_dir }}/{{ tls_pki_pem_file }}"

###################################
# Multi-domain certificate defaults
###################################
tls_pki_md_cert_filename: itential

# Multi-domain key
tls_pki_md_key_file: "{{ tls_pki_md_cert_filename }}{{ tls_pki_key_suffix }}"
tls_pki_md_key_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_md_key_file }}"
tls_pki_md_key_file_dest: "{{ tls_pki_keys_dir }}/{{ tls_pki_md_key_file }}"

# Multi-domain CSR
tls_pki_md_csr_file: "{{ tls_pki_md_cert_filename }}{{ tls_pki_csr_suffix }}"
tls_pki_md_csr_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_md_csr_file }}"

# Multi-domain certificate
tls_pki_md_cert_file: "{{ tls_pki_md_cert_filename }}{{ tls_pki_cert_suffix }}"
tls_pki_md_cert_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_md_cert_file }}"
tls_pki_md_cert_file_dest: "{{ tls_pki_certs_dir }}/{{ tls_pki_md_cert_file }}"

# Multi-domain PEM file (key + cert)
tls_pki_md_pem_file: "{{ tls_pki_md_cert_filename }}{{ tls_pki_pem_suffix }}"
tls_pki_md_pem_file_local: "{{ tls_pki_local_dir }}/{{ tls_pki_md_pem_file }}"
tls_pki_md_pem_file_dest: "{{ tls_pki_certs_dir }}/{{ tls_pki_md_pem_file }}"
