---
# The local pki directory must be defined in the inventory
pki_local_dir:

# The destination CA, certificate and key directories
pki_ca_certs_dir: /etc/pki/ca-trust/source/anchors
pki_certs_dir: /etc/pki/tls/certs
pki_keys_dir: /etc/pki/tls/private

# Whether to use the CA for signing the certificate
pki_own_ca: true

# CSR defaults
pki_csr_common_name: Itential
pki_csr_country_name: US
pki_csr_organization_name: Itential
pki_csr_organizational_unit_name: IT
pki_csr_state_or_province_name: Georgia
pki_csr_locality_name: Atlanta

# Extended Key Usage applied to generated leaf certs (per-host + multi-domain).
# Default matches the multi-domain workflow's previous hardcoded value, so
# existing users of that workflow see no behavior change unless overridden.
pki_extended_key_usage:
  - serverAuth
  - clientAuth

# CA defaults
pki_ca_common_name: Itential CA

# Key, certificate and CSR suffix
pki_key_suffix: .key
pki_cert_suffix: .crt
pki_pem_suffix: .pem
pki_csr_suffix: .csr

# Additional SAN defaults
pki_additional_dns_sans: []
pki_additional_ip_sans: []

#############
# CA defaults
#############
pki_ca_filename: ca

# CA key
pki_ca_key_file: "{{ pki_ca_filename }}{{ pki_key_suffix }}"
pki_ca_key_file_local: "{{ pki_local_dir }}/{{ pki_ca_key_file }}"

# CA CSR
pki_ca_csr_file: "{{ pki_ca_filename }}{{ pki_csr_suffix }}"
pki_ca_csr_file_local: "{{ pki_local_dir }}/{{ pki_ca_csr_file }}"

# CA certificate
pki_ca_cert_file: "{{ pki_ca_filename }}{{ pki_cert_suffix }}"
pki_ca_cert_file_local: "{{ pki_local_dir }}/{{ pki_ca_cert_file }}"
pki_ca_cert_file_dest: "{{ pki_ca_certs_dir }}/{{ pki_ca_cert_file }}"

###################################
# Server certificate defaults
###################################
pki_cert_filename: "{{ inventory_hostname }}"

# Server key
pki_key_file: "{{ pki_cert_filename }}{{ pki_key_suffix }}"
pki_key_file_local: "{{ pki_local_dir }}/{{ pki_key_file }}"
pki_key_file_dest: "{{ pki_keys_dir }}/{{ pki_key_file }}"

# Server CSR
pki_csr_file: "{{ pki_cert_filename }}{{ pki_csr_suffix }}"
pki_csr_file_local: "{{ pki_local_dir }}/{{ pki_csr_file }}"

# Server certificate
pki_cert_file: "{{ pki_cert_filename }}{{ pki_cert_suffix }}"
pki_cert_file_local: "{{ pki_local_dir }}/{{ pki_cert_file }}"
pki_cert_file_dest: "{{ pki_certs_dir }}/{{ pki_cert_file }}"

# PEM file (key + cert)
pki_pem_file: "{{ pki_cert_filename }}{{ pki_pem_suffix }}"
pki_pem_file_local: "{{ pki_local_dir }}/{{ pki_pem_file }}"
pki_pem_file_dest: "{{ pki_certs_dir }}/{{ pki_pem_file }}"

###################################
# Multi-domain certificate defaults
###################################
pki_md_cert_filename: itential

# Multi-domain key
pki_md_key_file: "{{ pki_md_cert_filename }}{{ pki_key_suffix }}"
pki_md_key_file_local: "{{ pki_local_dir }}/{{ pki_md_key_file }}"
pki_md_key_file_dest: "{{ pki_keys_dir }}/{{ pki_md_key_file }}"

# Multi-domain CSR
pki_md_csr_file: "{{ pki_md_cert_filename }}{{ pki_csr_suffix }}"
pki_md_csr_file_local: "{{ pki_local_dir }}/{{ pki_md_csr_file }}"

# Multi-domain certificate
pki_md_cert_file: "{{ pki_md_cert_filename }}{{ pki_cert_suffix }}"
pki_md_cert_file_local: "{{ pki_local_dir }}/{{ pki_md_cert_file }}"
pki_md_cert_file_dest: "{{ pki_certs_dir }}/{{ pki_md_cert_file }}"

# Multi-domain PEM file (key + cert)
pki_md_pem_file: "{{ pki_md_cert_filename }}{{ pki_pem_suffix }}"
pki_md_pem_file_local: "{{ pki_local_dir }}/{{ pki_md_pem_file }}"
pki_md_pem_file_dest: "{{ pki_certs_dir }}/{{ pki_md_pem_file }}"
